<h2>Potvrďte svůj e-mail</h2>
<p>Dobrý den, děkujeme za registraci v obchodě COLOR. Účet aktivujete kliknutím na tlačítko:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/muj-ucet"
      style="display:inline-block;padding:12px 24px;background:#1f4ff5;color:#fff;border-radius:10px;text-decoration:none;font-weight:600">Potvrdit e-mail</a></p>
<p>Pokud jste se neregistrovali, tento e-mail ignorujte.</p>
